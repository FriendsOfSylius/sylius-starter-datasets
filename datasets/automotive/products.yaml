# Automotive dataset: eighteen car parts, tyres, accessories, tools and workshop equipment from a fictional parts house (see dataset.yaml).
# The part reference ends each title, after a dash: the Torque theme prints it under the name on the product cards.
# Each image is a path relative to the dataset directory, so the import copies it instead of downloading it.
mode: ai
name: Automotive
products:
    -   title: 'Vented Brake Discs Ø 288 mm, Front Pair — TQ-BD288V'
        collection_name: Brakes & Suspension
        price_eur: 74.9
        image: media/vented_brake_discs_288.webp
        description: 'A pair of internally vented front discs in high-carbon cast iron, Ø 288 mm, 25 mm thick (21.8 mm minimum), 5 × 112 bolt pattern. Grey anti-corrosion coating on the hat and vanes, balanced and ready to fit without degreasing. For compact hatchbacks and saloons with a 15-inch brake. ECE R90 approved. Replace the pads at the same time.'
    -   title: 'Ceramic Brake Pads, Front Axle Set — TQ-BP4021C'
        collection_name: Brakes & Suspension
        price_eur: 39.9
        image: media/ceramic_brake_pads_front.webp
        description: 'Four low-dust ceramic pads for the front axle, 155.1 × 63.9 × 19.5 mm, with chamfered edges, a multi-layer anti-noise shim and an integrated wear sensor. Quiet, consistent bite from cold, gentle on the discs. ECE R90 approved. Fits the 288 mm discs TQ-BD288V. Trade packs of 10 sets on request.'
